[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etabs-beam-lab"
version = "0.7.0"
description = "Continuous concrete beam research datasets from ETABS 22, exported as CSV"
requires-python = ">=3.10"
dependencies = ["comtypes>=1.4.1,<2; sys_platform == 'win32'"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2,<3"]

[project.scripts]
etabs-beam-lab = "beam_lab.cli:main"

[tool.setuptools.packages.find]
include = ["beam_lab*"]

[tool.setuptools.package-data]
beam_lab = ["data/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
